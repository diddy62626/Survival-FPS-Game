<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survival FPS</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; background: #000; color: #fff; overflow: hidden; font-family: 'Orbitron', sans-serif; }

        #main-menu {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            display: flex; align-items: center; justify-content: center;
            background: #050505; z-index: 10000;
        }
        .menu-container {
            width: 500px; background: #111; padding: 60px;
            border: 2px solid #333; border-top: 6px solid #00ff66;
            text-align: center; box-shadow: 0 0 100px rgba(0,0,0,1);
        }
        h1 { font-size: 4em; color: #00ff66; margin-bottom: 40px; letter-spacing: 15px; }

        .btn {
            display: block; width: 100%; background: transparent; color: #fff;
            border: 1px solid #444; padding: 22px; margin: 15px 0;
            text-transform: uppercase; letter-spacing: 4px; cursor: pointer; transition: 0.3s;
            font-size: 1.2em; font-family: 'Orbitron', sans-serif;
        }
        .btn:hover { background: #00ff66; color: #000; border-color: #00ff66; box-shadow: 0 0 30px #00ff66; }

        #hud {
            position: absolute; bottom: 40px; left: 40px; background: rgba(0, 0, 0, 0.9);
            padding: 30px; border-left: 8px solid #00ff66; display: none; z-index: 100; min-width: 350px;
        }
        .hud-item { font-weight: 900; margin-bottom: 10px; font-size: 1.5em; text-transform: uppercase; }
        .progress-bar { width: 100%; height: 12px; background: #222; margin-top: 15px; border-radius: 6px; overflow: hidden; }
        #wave-progress { height: 100%; width: 0%; background: #00ff66; transition: width 0.3s; }

        .modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #0a0a0a; padding: 50px; border: 2px solid #333;
            border-top: 6px solid #00ff66; display: none; z-index: 11000; min-width: 450px;
            text-align: center;
        }
        .menu-active { display: block !important; }
        #crosshair {
            position: fixed; top: 50%; left: 50%; width: 24px; height: 24px;
            border: 3px solid rgba(0, 255, 100, 0.8); border-radius: 50%;
            transform: translate(-50%, -50%); display: none; pointer-events: none; z-index: 1000;
        }
        .sub-panel { display: none; flex-direction: column; width: 100%; }
        .sub-panel.active { display: flex; }
        input { width: 100%; padding: 18px; background: #000; border: 1px solid #333; color: #00ff66; margin-top: 20px; font-family: 'Orbitron'; text-align: center; font-size: 1.2em; }
    </style>
</head>
<body>
    <div id="main-menu">
        <div class="menu-container" id="primary-panel">
            <h1>SURVIVAL</h1>
            <button class="btn" onclick="showSubPanel('sp-panel')">Singleplayer</button>
            <button class="btn" onclick="showSubPanel('mp-panel')">Multiplayer</button>
            <div style="margin-top:20px; color:#333;">SEED: <input type="text" id="seed-input" placeholder="AUTO" style="width:100px; background:none; border:none; color:#333; display:inline;"></div>
        </div>
        <div class="menu-container sub-panel" id="sp-panel">
            <button class="btn" onclick="startGame('sp', 'easy')">Easy</button>
            <button class="btn" onclick="startGame('sp', 'normal')">Normal</button>
            <button class="btn" onclick="startGame('sp', 'hard')">Hard</button>
            <button class="btn" style="border:none; color:#555;" onclick="showSubPanel('primary-panel')">Back</button>
        </div>
        <div class="menu-container sub-panel" id="mp-panel">
            <button class="btn" onclick="startGame('mp', 'main-room')">Join Public</button>
            <button class="btn" onclick="showSubPanel('room-panel')">Custom Room</button>
            <button class="btn" style="border:none; color:#555;" onclick="showSubPanel('primary-panel')">Back</button>
        </div>
        <div class="menu-container sub-panel" id="room-panel">
            <input type="text" id="room-input" placeholder="ROOM NAME">
            <button class="btn" onclick="joinCustomRoom()">Start</button>
            <button class="btn" style="border:none; color:#555;" onclick="showSubPanel('mp-panel')">Back</button>
        </div>
    </div>

    <div id="hud">
        <div class="hud-item">HP: <span id="hp" style="color:#ff4444;">100</span></div>
        <div class="hud-item">PTS: <span id="points" style="color:#00ff66;">0</span></div>
        <div class="hud-item">WAVE: <span id="wave">1</span></div>
        <div class="hud-item">LEFT: <span id="enemies-left">0</span></div>
        <div class="progress-bar"><div id="wave-progress"></div></div>
    </div>
    <div id="crosshair"></div>

    <div id="settings-menu" class="modal">
        <h2 style="margin-bottom:30px; color:#00ff66;">SETTINGS</h2>
        <input type="range" id="fov-slider" min="40" max="120" value="75">
        <button class="btn" onclick="toggleMenu('settings-menu')">CLOSE</button>
    </div>
    <div id="shop-menu" class="modal">
        <h2 style="margin-bottom:30px;">SHOP</h2>
        <button class="btn" onclick="buyItem('health', 300)">HEAL (300)</button>
        <button class="btn" onclick="toggleMenu('shop-menu')">CLOSE</button>
    </div>

    <script type="module" src="/src/client/main.js"></script>
    <script>
        function showSubPanel(id) {
            document.querySelectorAll('.sub-panel, .menu-container').forEach(p => p.classList.remove('active'));
            document.getElementById('primary-panel').style.display = 'none';
            document.getElementById(id).classList.add('active');
            if(id === 'primary-panel') document.getElementById('primary-panel').style.display = 'block';
        }
        function toggleMenu(id) {
            const el = document.getElementById(id);
            if(!el) return;
            const isOpening = !el.classList.contains('menu-active');
            document.querySelectorAll('.modal').forEach(m => m.classList.remove('menu-active'));
            if (isOpening) {
                el.classList.add('menu-active');
                if(window.unlockMouse) window.unlockMouse();
            } else {
                if(window.tryLockMouse) window.tryLockMouse();
            }
        }
        window.showSubPanel = showSubPanel; window.toggleMenu = toggleMenu;
    </script>
</body>
</html>
