<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SURVIVAL FPS</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Share+Tech+Mono&display=swap');

        :root {
            --neon: #00ff66;
            --dark: #0a0a0a;
            --zinc: #1a1a1a;
            --glow: rgba(0, 255, 102, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: crosshair; }

        body {
            overflow: hidden;
            background: #000;
            font-family: 'Share Tech Mono', monospace;
            color: #fff;
            width: 100vw;
            height: 100vh;
        }

        /* Scanline Effect overlay */
        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 100000;
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
        }

        /* ABSOLUTELY CENTERED MAIN MENU */
        #main-menu {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, rgba(20,20,20,0.4) 0%, #000 100%);
            z-index: 9999;
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .menu-frame {
            position: relative;
            background: rgba(10, 10, 10, 0.9);
            padding: 60px;
            width: 550px;
            text-align: center;
            /* Cyberpunk Clipped Edges */
            clip-path: polygon(0% 15%, 15% 0%, 100% 0%, 100% 85%, 85% 100%, 0% 100%);
            border: 1px solid var(--zinc);
            box-shadow: 0 0 50px rgba(0,0,0,1), inset 0 0 20px var(--glow);
        }

        .menu-frame::before {
            content: "";
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 5px;
            background: var(--neon);
            box-shadow: 0 0 20px var(--neon);
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 5em;
            font-weight: 900;
            color: #fff;
            margin-bottom: 50px;
            letter-spacing: 20px;
            text-shadow: 0 0 10px var(--neon);
            animation: glitch 2s infinite;
        }

        @keyframes glitch {
            0% { text-shadow: 2px 2px var(--neon); }
            50% { text-shadow: -2px -2px #ff00ff; }
            100% { text-shadow: 2px 2px var(--neon); }
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
        }

        .custom-btn {
            position: relative;
            background: transparent;
            color: #fff;
            border: 1px solid var(--neon);
            padding: 20px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 5px;
            cursor: pointer;
            transition: all 0.3s;
            overflow: hidden;
            clip-path: polygon(0% 0%, 90% 0%, 100% 30%, 100% 100%, 10% 100%, 0% 70%);
        }

        .custom-btn:hover {
            background: var(--neon);
            color: #000;
            box-shadow: 0 0 30px var(--neon);
            transform: scale(1.05);
        }

        .custom-btn::after {
            content: ">>";
            position: absolute;
            right: 20px;
            opacity: 0;
            transition: 0.3s;
        }

        .custom-btn:hover::after {
            opacity: 1;
            right: 30px;
        }

        /* HUD STYLING */
        #ui-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100; }

        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 30px; height: 30px;
            transform: translate(-50%, -50%); display: none;
        }
        #crosshair::before, #crosshair::after {
            content: ""; position: absolute; background: var(--neon);
        }
        #crosshair::before { top: 50%; left: 0; width: 100%; height: 2px; }
        #crosshair::after { left: 50%; top: 0; width: 2px; height: 100%; }

        #hud {
            position: absolute; bottom: 50px; left: 50px;
            background: rgba(0,0,0,0.8); padding: 30px;
            border-left: 10px solid var(--neon);
            display: none; pointer-events: auto;
            clip-path: polygon(0 0, 100% 0, 95% 100%, 0 100%);
        }

        .hud-stat { margin-bottom: 10px; }
        .hud-label { font-size: 0.8em; color: #888; text-transform: uppercase; }
        .hud-value { font-family: 'Orbitron'; font-size: 2em; font-weight: 900; display: block; }

        /* MODALS */
        .cyber-modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(5,5,5,0.98); padding: 50px;
            border: 2px solid var(--neon);
            display: none; z-index: 10000; min-width: 500px;
            clip-path: polygon(0 0, 95% 0, 100% 5%, 100% 100%, 5% 100%, 0 95%);
            box-shadow: 0 0 100px #000;
        }
        .menu-active { display: block !important; }

        .setting-field { margin: 40px 0; text-align: left; }
        .field-header { display: flex; justify-content: space-between; font-family: 'Orbitron'; margin-bottom: 15px; }

        input[type="range"] {
            -webkit-appearance: none; width: 100%; height: 4px; background: #333; outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 30px; height: 15px; background: var(--neon);
            clip-path: polygon(20% 0%, 100% 0%, 80% 100%, 0% 100%);
            cursor: pointer;
        }

        .sub-panel { display: none; width: 100%; }
        .sub-panel.active { display: flex; flex-direction: column; }

        .cyber-input {
            background: #111; border: 1px solid #333; color: var(--neon);
            padding: 20px; width: 100%; margin: 20px 0; font-family: 'Share Tech Mono';
            font-size: 1.5em; text-align: center; outline: none;
        }

        #settings-trigger {
            position: fixed; top: 40px; right: 40px; z-index: 1001; cursor: pointer;
            background: var(--zinc); padding: 15px; clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            border: 1px solid var(--neon); transition: 0.3s;
        }
        #settings-trigger:hover { background: var(--neon); }
        #settings-trigger:hover svg { stroke: #000; }

        .back-link { color: #555; text-decoration: underline; margin-top: 20px; font-size: 0.9em; cursor: pointer; }
    </style>
</head>
<body>
    <div id="notification" style="position:fixed; top:40px; left:50%; transform:translateX(-50%); background:var(--neon); color:#000; padding:15px 40px; font-weight:bold; z-index:100000; display:none;">SYSTEM UPDATED</div>

    <div id="settings-trigger" onclick="toggleMenu('settings-menu')">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#00ff66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1V15a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
    </div>

    <!-- ADVANCED CYBER UI MENU -->
    <div id="main-menu">
        <div class="menu-frame" id="primary-panel">
            <h1>SURVIVAL</h1>
            <div class="btn-group">
                <button class="custom-btn" onclick="showSubPanel('sp-panel')">Singleplayer</button>
                <button class="custom-btn" onclick="showSubPanel('mp-panel')">Multiplayer</button>
            </div>
        </div>

        <div class="menu-frame sub-panel" id="sp-panel">
            <h2 style="font-family: Orbitron; margin-bottom: 30px;">DEPLOYMENT</h2>
            <div class="btn-group">
                <button class="custom-btn" onclick="startGame('sp', 'easy')">Easy</button>
                <button class="custom-btn" onclick="startGame('sp', 'normal')">Normal</button>
                <button class="custom-btn" onclick="startGame('sp', 'hard')">Hard</button>
                <div class="back-link" onclick="showSubPanel('primary-panel')">RETURN TO BASE</div>
            </div>
        </div>

        <div class="menu-frame sub-panel" id="mp-panel">
            <h2 style="font-family: Orbitron; margin-bottom: 30px;">NETWORK LINK</h2>
            <div class="btn-group">
                <button class="custom-btn" onclick="startGame('mp', 'main-room')">Join Public</button>
                <button class="custom-btn" onclick="showSubPanel('room-panel')">Custom Room</button>
                <div class="back-link" onclick="showSubPanel('primary-panel')">RETURN TO BASE</div>
            </div>
        </div>

        <div class="menu-frame sub-panel" id="room-panel">
            <h2 style="font-family: Orbitron;">ID FREQUENCY</h2>
            <input type="text" id="room-input" class="cyber-input" placeholder="000-000">
            <button class="custom-btn" onclick="joinCustomRoom()">INITIALIZE</button>
            <div class="back-link" onclick="showSubPanel('mp-panel')">BACK</div>
        </div>
    </div>

    <!-- HUD -->
    <div id="ui-container">
        <div id="crosshair"></div>
        <div id="hud">
            <div class="hud-stat">
                <span class="hud-label">Vitals</span>
                <span id="hp" class="hud-value" style="color: #ff4444;">100</span>
            </div>
            <div class="hud-stat">
                <span class="hud-label">Credits</span>
                <span id="points" class="hud-value" style="color: var(--neon);">0</span>
            </div>
            <div class="hud-stat">
                <span class="hud-label">Threat Level</span>
                <span id="wave" class="hud-value">1</span>
            </div>
            <div class="hud-stat">
                <span class="hud-label">Equipped</span>
                <span id="weapon" class="hud-value" style="font-size: 1.2em;">Fist</span>
            </div>
            <div style="display:flex; gap: 10px; margin-top:20px;">
                <button class="custom-btn" style="padding:10px; font-size:0.7em;" onclick="toggleMenu('shop-menu')">Shop</button>
                <button class="custom-btn" style="padding:10px; font-size:0.7em;" onclick="toggleMenu('room-menu')">Rooms</button>
            </div>
        </div>
    </div>

    <!-- CYBER MODALS -->
    <div id="settings-menu" class="cyber-modal">
        <h2 style="font-family: Orbitron; color: var(--neon); letter-spacing: 5px;">CONFIGURATION</h2>
        <div class="setting-field">
            <div class="field-header"><span>Optics (FOV)</span><span id="fov-val">75</span></div>
            <input type="range" id="fov-slider" min="40" max="120" value="75">
        </div>
        <div class="setting-field">
            <div class="field-header"><span>Processing (Dist)</span><span id="dist-val">50</span></div>
            <input type="range" id="dist-slider" min="1" max="100" value="50">
        </div>
        <button class="custom-btn" id="perf-toggle" onclick="togglePerformance()">OPTIMIZATION: OFF</button>
        <button class="custom-btn" style="margin-top:40px; border-color:#555;" onclick="toggleMenu('settings-menu')">SYNC & RESUME</button>
    </div>

    <div id="shop-menu" class="cyber-modal">
        <h2 style="font-family: Orbitron;">ARSENAL</h2>
        <div style="margin:20px 0; border:1px solid #333; padding:20px;">
            <h3>TACTICAL KNIFE</h3><button class="custom-btn" style="font-size:0.8em; margin-top:10px;" onclick="buyItem('knife', 500)">500 CR</button>
        </div>
        <div style="margin:20px 0; border:1px solid #333; padding:20px;">
            <h3>ENERGY PISTOL</h3><button class="custom-btn" style="font-size:0.8em; margin-top:10px;" onclick="buyItem('pistol', 1500)">1500 CR</button>
        </div>
        <button class="custom-btn" onclick="toggleMenu('shop-menu')">CLOSE</button>
    </div>

    <div id="room-menu" class="cyber-modal">
        <h2 style="font-family: Orbitron;">FREQUENCY MODULATOR</h2>
        <input type="text" id="switch-room-id" class="cyber-input" placeholder="NEW-FREQ">
        <button class="custom-btn" onclick="switchRoom()">ESTABLISH LINK</button>
        <button class="custom-btn" onclick="toggleMenu('room-menu')">ABORT</button>
    </div>

    <script type="module" src="/src/client/main.js"></script>
    <script>
        function showSubPanel(id) {
            document.querySelectorAll('.sub-panel').forEach(p => p.classList.remove('active'));
            document.getElementById('primary-panel').style.display = 'none';
            const el = document.getElementById(id);
            el.classList.add('active');
            if(id === 'primary-panel') el.style.display = 'block';
        }
        function toggleMenu(id) {
            const el = document.getElementById(id);
            const isOpening = !el.classList.contains('menu-active');
            document.querySelectorAll('.cyber-modal').forEach(m => m.classList.remove('menu-active'));
            if (isOpening) {
                el.classList.add('menu-active');
                if (window.unlockMouse) window.unlockMouse();
            } else {
                if (window.tryLockMouse) window.tryLockMouse();
            }
        }
        function showNotification(text) {
            const n = document.getElementById('notification');
            n.innerText = text; n.style.display = 'block';
            setTimeout(() => n.style.display = 'none', 3000);
        }
        window.showSubPanel = showSubPanel;
        window.toggleMenu = toggleMenu;
        window.showNotification = showNotification;
    </script>
</body>
</html>
