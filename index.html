<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survival FPS Multiplayer</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            background: #050505;
            font-family: 'Roboto', sans-serif;
            color: #e0e0e0;
        }

        #ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 12px;
            height: 12px;
            border: 2px solid rgba(0, 255, 100, 0.7);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            display: none;
        }

        #hud {
            position: absolute;
            bottom: 30px;
            left: 30px;
            pointer-events: auto;
            background: rgba(10, 10, 10, 0.85);
            padding: 20px;
            border-radius: 4px;
            border-left: 4px solid #00ff66;
            display: none;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .hud-item {
            margin-bottom: 8px;
            font-size: 1.1em;
            font-weight: 700;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Main Menu Styling */
        #main-menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.9)), url('https://images.unsplash.com/photo-1614850523296-d8c1af93d400?auto=format&fit=crop&q=80&w=1000') center/cover;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.5s ease;
        }

        .menu-panel {
            background: rgba(15, 15, 15, 0.95);
            padding: 40px;
            border: 1px solid #333;
            border-top: 5px solid #00ff66;
            width: 400px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5em;
            margin-bottom: 40px;
            color: #00ff66;
            text-shadow: 0 0 15px rgba(0, 255, 106, 0.5);
            letter-spacing: 5px;
        }

        .btn {
            pointer-events: auto;
            background: transparent;
            color: #fff;
            border: 1px solid #444;
            padding: 12px 24px;
            cursor: pointer;
            margin: 10px;
            border-radius: 2px;
            font-weight: 700;
            font-size: 0.9em;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.2s ease;
            width: 100%;
            display: block;
        }

        .btn:hover {
            background: #00ff66;
            color: #000;
            border-color: #00ff66;
            box-shadow: 0 0 20px rgba(0, 255, 106, 0.4);
        }

        .btn-small {
            width: auto;
            display: inline-block;
            padding: 8px 16px;
            font-size: 0.7em;
        }

        #shop-menu, #room-menu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10, 10, 10, 0.98);
            padding: 40px;
            border: 1px solid #333;
            border-top: 4px solid #00ff66;
            display: none;
            pointer-events: auto;
            text-align: center;
            z-index: 110;
        }

        .menu-active { display: block !important; }

        input {
            padding: 12px;
            border-radius: 2px;
            border: 1px solid #333;
            background: #111;
            color: #fff;
            margin: 10px 0;
            width: 100%;
            box-sizing: border-box;
            font-family: 'Roboto', sans-serif;
        }

        .sub-menu {
            display: none;
            width: 100%;
        }

        .sub-menu.active {
            display: block;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #00ff66;
            color: #000;
            padding: 15px 25px;
            font-weight: bold;
            font-family: 'Orbitron', sans-serif;
            border-radius: 2px;
            display: none;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="notification" class="notification">ITEM PURCHASED</div>

    <!-- Main Menu -->
    <div id="main-menu">
        <h1>SURVIVAL</h1>

        <div class="menu-panel" id="primary-menu">
            <button class="btn" onclick="showSubMenu('sp-menu')">Singleplayer</button>
            <button class="btn" onclick="showSubMenu('mp-menu')">Multiplayer</button>
        </div>

        <div class="menu-panel sub-menu" id="sp-menu">
            <h3 style="font-family: 'Orbitron'; color: #888;">SELECT DIFFICULTY</h3>
            <button class="btn" onclick="startGame('sp', 'easy')">Easy</button>
            <button class="btn" onclick="startGame('sp', 'normal')">Normal</button>
            <button class="btn" onclick="startGame('sp', 'hard')">Hard</button>
            <button class="btn" style="border: none; color: #888; font-size: 0.7em;" onclick="showSubMenu('primary-menu')">Back</button>
        </div>

        <div class="menu-panel sub-menu" id="mp-menu">
            <h3 style="font-family: 'Orbitron'; color: #888;">MULTIPLAYER</h3>
            <button class="btn" onclick="startGame('mp', 'main-room')">Join Public Room</button>
            <button class="btn" onclick="showSubMenu('custom-room-menu')">Create / Join Room</button>
            <button class="btn" style="border: none; color: #888; font-size: 0.7em;" onclick="showSubMenu('primary-menu')">Back</button>
        </div>

        <div class="menu-panel sub-menu" id="custom-room-menu">
            <h3 style="font-family: 'Orbitron'; color: #888;">CUSTOM ROOM</h3>
            <input type="text" id="room-input" placeholder="Room Name">
            <input type="password" id="pass-input" placeholder="Passcode (Optional)">
            <button class="btn" onclick="joinCustomRoom()">Join Room</button>
            <button class="btn" style="border: none; color: #888; font-size: 0.7em;" onclick="showSubMenu('mp-menu')">Back</button>
        </div>
    </div>

    <!-- HUD and Overlays -->
    <div id="ui-container">
        <div id="crosshair"></div>
        <div id="hud">
            <div class="hud-item">HP: <span id="hp" style="color: #ff4444;">100</span></div>
            <div class="hud-item">POINTS: <span id="points" style="color: #00ff66;">0</span></div>
            <div class="hud-item">WAVE: <span id="wave">1</span></div>
            <div class="hud-item">WEAPON: <span id="weapon">Fist</span></div>
            <div style="margin-top: 15px; border-top: 1px solid #333; padding-top: 10px;">
                <button class="btn btn-small" onclick="toggleMenu('shop-menu')">SHOP (B)</button>
                <button class="btn btn-small" onclick="toggleMenu('room-menu')">ROOMS (M)</button>
            </div>
        </div>
    </div>

    <!-- In-game Menus -->
    <div id="shop-menu">
        <h2 style="font-family: 'Orbitron'; margin-bottom: 20px;">ARSENAL</h2>
        <div id="shop-items">
            <div style="margin: 15px 0; border: 1px solid #222; padding: 20px; background: #0a0a0a;">
                <h3 style="margin-top: 0;">KNIFE</h3>
                <p style="color: #888; font-size: 0.9em;">Faster attacks, higher melee damage.</p>
                <button class="btn" onclick="buyItem('knife', 500)">BUY (500 pts)</button>
            </div>
            <div style="margin: 15px 0; border: 1px solid #222; padding: 20px; background: #0a0a0a;">
                <h3 style="margin-top: 0;">PISTOL</h3>
                <p style="color: #888; font-size: 0.9em;">Reliable firepower for any distance.</p>
                <button class="btn" onclick="buyItem('pistol', 1500)">BUY (1500 pts)</button>
            </div>
            <div style="margin: 15px 0; border: 1px solid #222; padding: 20px; background: #0a0a0a;">
                <h3 style="margin-top: 0;">MEDKIT</h3>
                <p style="color: #888; font-size: 0.9em;">Instantly restore 50% health.</p>
                <button class="btn" onclick="buyItem('health', 300)">BUY (300 pts)</button>
            </div>
        </div>
        <button class="btn" onclick="toggleMenu('shop-menu')">CLOSE</button>
    </div>

    <div id="room-menu">
        <h2 style="font-family: 'Orbitron';">SWITCH ROOM</h2>
        <input type="text" id="switch-room-id" placeholder="Room Name">
        <button class="btn" onclick="switchRoom()">SWITCH</button>
        <button class="btn" onclick="toggleMenu('room-menu')">CLOSE</button>
    </div>

    <script type="module" src="/src/client/main.js"></script>
    <script>
        function showSubMenu(id) {
            document.querySelectorAll('.menu-panel').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if (id === 'primary-menu') {
                document.getElementById('primary-menu').style.display = 'block';
            } else {
                document.getElementById('primary-menu').style.display = 'none';
            }
        }

        function toggleMenu(id) {
            const el = document.getElementById(id);
            const isOpening = !el.classList.contains('menu-active');

            document.getElementById('shop-menu').classList.remove('menu-active');
            document.getElementById('room-menu').classList.remove('menu-active');

            if (isOpening) {
                el.classList.add('menu-active');
                document.exitPointerLock();
            }
        }

        function showNotification(text) {
            const n = document.getElementById('notification');
            n.innerText = text;
            n.style.display = 'block';
            setTimeout(() => n.style.display = 'none', 3000);
        }

        window.showSubMenu = showSubMenu;
        window.toggleMenu = toggleMenu;
        window.showNotification = showNotification;
    </script>
</body>
</html>
